name: Verify isolated demo collision correction
on:
  push:
    branches: [fix/demo-physical-collisions]
    paths: [.github/workflows/demo-physics-candidate.yml, .review/physics-edits.json]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only hash-checked demo integration edits
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          expected={'src/demo-physics.js':'22f316deb8fc7477b179e7379f3264efab655863','src/demo-round.js':'f8c8a8e9145eaa07a24431966f0fe54774d876eb','tests/demo-physics.test.mjs':'30101b64ab5f4eab1069c4bb3bb0b66ca638ea7b','tests/demo-round.test.mjs':'acacc5e609284364529ded1a5944948a94329ed8'}
          for path,sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip()==sha,path
          edits=json.loads(Path('.review/physics-edits.json').read_text())
          allowed={'docs/QUICKSTART.md','index.html','package.json','src/app.js','src/full-round-demo.js','tests/full_round_demo_browser.py','tests/live_demo_smoke.py'}
          assert {e['path'] for e in edits}==allowed and len(edits)==len(allowed)
          for e in edits:
              p=Path(e['path']);old=p.read_text();assert hashlib.sha256(old.encode()).hexdigest()==e['before'],f'Unexpected baseline: {p}'
              new=old
              for a,b,text in reversed(e['ops']):
                  assert 0<=a<=b<=len(old)
                  new=new[:a]+text+new[b:]
              assert hashlib.sha256(new.encode()).hexdigest()==e['after'],f'Unexpected candidate: {p}'
              p.write_text(new)
          subprocess.run(['git','add','--',*allowed],check=True)
          PY
          git diff --cached --check
          npm run check && npm test
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise physical demo and saved-data isolation
        run: python tests/full_round_demo_browser.py
      - name: Commit passing runtime edits without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use solved physical trajectories in the full-round demo' -m '169 analytic/regression tests and the actual browser demo acceptance passed. Current 426bd2d button cache fix retained, changed demo imports versioned, live capture/referee/storage engines unchanged. This branch-only source transport must be removed before full release review.'
          git push origin HEAD:refs/heads/fix/demo-physical-collisions
      - name: Preserve candidate source and evidence
        if: always()
        run: git archive --format=tar $(git write-tree) > /tmp/demo-physics-candidate.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-physics-candidate-evidence
          path: |
            /tmp/demo-physics-candidate.tar
            test-results/full-demo*.png
            test-results/full-round-demo-report.json
            test-results/physics-demo.webm
          retention-days: 3
