name: Branch review snapshot
on:
  push:
    branches: [feature/auto-play-referee-v1]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=tar HEAD > review-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: review-source.tar
          retention-days: 1
