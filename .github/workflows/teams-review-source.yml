name: Teams review source
on:
  push:
    branches: [feature/automatic-teams-rounds]
    paths: [.github/workflows/teams-review-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > teams-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: teams-source
          path: teams-source.tar
          retention-days: 1
