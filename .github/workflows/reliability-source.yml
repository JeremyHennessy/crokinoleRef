name: Reliability source snapshot
on:
  push:
    branches: [feature/reliability-play-library]
    paths: [.github/workflows/reliability-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 034bd85b3ff1a24eb0fd41804f5f64cfd88ab632
      - run: git archive --format=tar HEAD > /tmp/reliability-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: reliability-source
          path: /tmp/reliability-source.tar
          retention-days: 1
