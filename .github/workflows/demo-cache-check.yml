name: Diagnose cached full-demo button
on:
  push:
    branches: [fix/full-demo-cache-upgrade]
permissions:
  contents: read
jobs:
  cache-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain the exact previous one-shot release for cache upgrade testing
        run: git fetch --depth=1 origin 616f9cf03caf17e0815925275d9fc04a71187526
      - name: Install isolated Chromium and WebKit
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Reproduce the reported inert button without changing runtime files
        run: python tests/cache_upgrade_browser.py --diagnose-only --engines chromium,webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-cache-diagnosis
          path: |
            test-results/cache-*.png
            test-results/cache-upgrade-report.json
          retention-days: 3
