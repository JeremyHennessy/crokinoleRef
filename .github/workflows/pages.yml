name: Test and publish Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Unit and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check && npm test
      - name: Install isolated browser and recorded-video test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Exercise real browser APIs with synthetic camera
        run: |
          python tests/browser_smoke.py
          python tests/teams_rounds_browser.py
          python tests/reliability_browser.py
          python tests/offline_replay_proof.py
      - name: Preserve browser evidence (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/preroll-*.webm
            test-results/full-match-*.zip
            test-results/offline-proof/**
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages (enable GitHub Actions in repository Pages settings first)
        uses: actions/configure-pages@v5
      - name: Stage only public runtime assets
        run: |
          mkdir -p _site
          cp index.html styles.css .nojekyll _site/
          cp -r src docs _site/
          python - <<'PY'
          import json, os, datetime
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          Path('_site/build-info.json').write_text(json.dumps({'commit': sha, 'version': '0.1.0', 'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          p = Path('_site/index.html')
          p.write_text(p.read_text().replace('Prototype 0.1.0</span>', f'Prototype 0.1.0 · {sha[:7]}</span>'))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy tested commit
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published commit (not physical camera accuracy)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['PAGE_URL'].rstrip('/') + '/build-info.json'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url + '?verify=' + os.environ['GITHUB_SHA'], timeout=20) as r:
                      data = json.load(r)
                  if data.get('commit') == os.environ['GITHUB_SHA']:
                      print('Published commit verified:', data['commit'])
                      break
              except Exception as e:
                  print(type(e).__name__, str(e))
              time.sleep(10)
          else:
              raise SystemExit('Published commit could not be verified; do not report deployment as verified.')
          PY
