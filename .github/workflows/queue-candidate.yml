name: Verify captured-frame queue candidate
on:
  push:
    branches: [review/captured-frame-queue]
    paths: [.github/workflows/queue-candidate.yml, .review/queue-edits.json]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only guarded capture integration edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          edits=json.loads(Path('.review/queue-edits.json').read_text())
          allowed={'src/app.js','src/vision-worker.js','tests/capture-time.test.mjs','package.json'}
          assert len(edits)==4 and {e['path'] for e in edits}==allowed
          for e in edits:
              p=Path(e['path']);old=p.read_text();assert hashlib.sha256(old.encode()).hexdigest()==e['before'],str(p)
              new=old
              for a,b,text in reversed(e['ops']):
                  assert 0<=a<=b<=len(old)
                  new=new[:a]+text+new[b:]
              assert hashlib.sha256(new.encode()).hexdigest()==e['after'],str(p)
              p.write_text(new)
          subprocess.run(['git','add','--',*allowed],check=True)
          PY
          git diff --cached --check
          cp .git/index /tmp/queue-index
          GIT_INDEX_FILE=/tmp/queue-index git rm --cached .review/queue-edits.json .github/workflows/queue-candidate.yml
          test "$(GIT_INDEX_FILE=/tmp/queue-index git write-tree)" = e62f52688da8bba6788030ab37188057db8407df
          npm run check && npm test
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Profile the real full-round camera flow without forcing review acceptance
        run: python tests/frame_stage_profile.py
      - name: Commit passing source objects to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retain actual camera frames across brief worker delays with bounded overflow review' -m '193 local and runner Node tests passed. Exact clean tree e62f52688da8bba6788030ab37188057db8407df. Pixel buffers/timestamps are not invented, all original gates retained and any queue overflow explicitly forces review. Full release regression suite still required; remove temporary source application files before PR publication.'
          git push origin HEAD:refs/heads/review/captured-frame-queue
      - name: Preserve exact candidate and timing evidence
        if: always()
        run: git archive --format=tar $(git write-tree) > /tmp/capture-queue-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-queue-candidate
          path: |
            /tmp/capture-queue-source.tar
            test-results/frame-stage-profile.json
          retention-days: 1
