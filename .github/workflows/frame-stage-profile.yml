name: Isolated frame-stage diagnosis
on:
  push:
    branches: [review/frame-stage-profile]
    paths: [.github/workflows/frame-stage-profile.yml, tests/frame_stage_profile.py]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Same-run baseline and single-context experiment
        run: |
          python tests/frame_stage_profile.py
          mv test-results/frame-stage-profile.json test-results/frame-stage-baseline.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('src/app.js');s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='d58cf55c6513acc0aa90582a65b0eab25a9c3b769e599567888e77c536585f89'
          old="rawCtx = raw.getContext('2d', { willReadFrequently: true })"
          assert s.count(old)==1
          p.write_text(s.replace(old,"rawCtx = raw.getContext('2d')"))
          PY
          python tests/frame_stage_profile.py
          mv test-results/frame-stage-profile.json test-results/frame-stage-render-context.json
          git diff -- src/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-stage-ab-comparison
          path: test-results/frame-stage-*.json
          retention-days: 3
