name: Compare direct capture destinations after export isolation
on:
  push:
    branches: [work/export-capture-proof]
    paths: [.github/workflows/export-capture-proof.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct the verified export-only candidate
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          edits=json.loads(Path('.review/export-edits.json').read_text())
          for e in edits:
              p=Path(e['path']);old=p.read_text();assert hashlib.sha256(old.encode()).hexdigest()==e['before'],str(p)
              new=old
              for a,b,text in reversed(e['ops']):
                  assert 0<=a<=b<=len(old)
                  new=new[:a]+text+new[b:]
              assert hashlib.sha256(new.encode()).hexdigest()==e['after'],str(p)
              p.write_text(new)
          subprocess.run(['git','add','--',*[e['path'] for e in edits]],check=True)
          PY
          git diff --cached --check
          npm run check && npm test
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Compare original and direct destinations without altering evidence gates
        run: python tests/canvas_pipeline_browser.py
      - name: Stage only the tested direct-source integration
        run: |
          echo 'c7d9cafd9a0e28b63b18b82dac8b6cb410dec756cae6cf97cd6e725caa086adf  /tmp/direct-candidate-app.js' | sha256sum -c -
          cp /tmp/direct-candidate-app.js src/app.js
          git add src/app.js
          npm run check && npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Avoid redundant full-resolution CPU copy in live frame presentation' -m 'One-variable synthetic browser comparison verifies direct display and small analysis destination while preserving real timestamps, pixel scores and safety gates. Full physical-camera validation remains separate.'
          git push origin HEAD:refs/heads/work/export-capture-proof
      - name: Preserve exact source and timing reports
        if: always()
        run: git archive --format=tar $(git write-tree) > /tmp/export-capture-candidate.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-pipeline-evidence
          path: |
            /tmp/export-capture-candidate.tar
            test-results/canvas-pipeline-report.json
          retention-days: 3
