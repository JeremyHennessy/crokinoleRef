name: Apply reviewed format layout
on:
  push:
    branches: [feature/reliability-play-library]
    paths: [.github/workflows/fix-format-layout.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline and exact small layout delta
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          hashes={
            'index.html':('9375d46940c5efb0477c945df05a8ca40d4804cf31a2366ca12b4cd64a06364c','793b9bd2aaecc0d2b79cb321972485fc8ddef75fdc1ae3cbf2c20a7c4e7f957e'),
            'styles.css':('220e4bb2f4304a5686f5a682786028da17fc67b0d92de54ec20e0357ecdc3145','759f51603cb9da373a2ef27227cc3b55de13a42ded384d0758b12f787ba118b5'),
            'tests/reliability_browser.py':('f1c4fd03fd28dc853921c9b228c1914571826c9dd305ea88abfcdbe56018236b','f0b7ae62a43c24d503c2eeecbd58018ae80adbad9f97cff277fd6024f1e6c8f5')}
          for name,(before,after) in hashes.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==before,name
          p=Path('index.html');s=p.read_text();start=s.index('<div class="score-controls"><label for="format-preset">');end=s.index('<p id="allocation-help"',start)
          s=s[:start]+'''<div class="game-format-controls"><div><label for="format-preset">Game format</label><select id="format-preset"><option value="casual">Casual · 12 shots per team</option><option value="singles">Singles · 8 shots per team</option><option value="doubles">Doubles · 12 shots per team</option><option value="custom">Custom practice</option></select></div><div><label for="starting-team">First-round starting team</label><select id="starting-team"><option value="auto">Learn from the first clear launch</option><option value="0">Team A</option><option value="1">Team B</option></select></div><div><label for="round-allocation">Shots per team</label><input id="round-allocation" type="number" min="1" max="12" value="12" aria-describedby="allocation-help"></div><p class="help">Starting team alternates in later rounds. This sets allocation and turn order, not a complete tournament rules engine.</p></div>'''+s[end:];p.write_text(s)
          p=Path('styles.css');s=p.read_text();s+='''
          /* Keep the added game-format fields readable at desktop and table-side widths. */
          .game-format-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;padding:0 24px}.game-format-controls>div{min-width:0}.game-format-controls select,.game-format-controls input{width:100%;min-width:0;max-width:none}.game-format-controls>.help{grid-column:1/-1;margin:4px 0}.game-format-controls label{line-height:1.4}@media(max-width:600px){.game-format-controls{grid-template-columns:minmax(0,1fr);padding:0 18px;gap:4px}}
          ''';p.write_text(s)
          p=Path('tests/reliability_browser.py');s=p.read_text()
          old="        page.screenshot(path=str(OUT/f'play-view-{angled}.png'),full_page=True)"
          new="        for field in ['format-preset','starting-team']:\n            assert page.locator('#'+field).bounding_box()['width'] >= 160, 'Game-format controls must remain readable'\n"+old
          assert old in s;s=s.replace(old,new)
          old="            page.screenshot(path=str(OUT/'play-mobile.png'),full_page=True)"
          new="            for field in ['format-preset','starting-team','round-allocation']:\n                assert page.locator('#'+field).bounding_box()['width'] >= 160, 'Mobile format fields cannot shrink to arrows'\n"+old
          assert old in s;s=s.replace(old,new);p.write_text(s)
          for name,(before,after) in hashes.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==after,name
          PY
          git add index.html styles.css tests/reliability_browser.py
          git diff --cached --check
          cp .git/index /tmp/layout-index
          GIT_INDEX_FILE=/tmp/layout-index git rm --cached .github/workflows/fix-format-layout.yml
          test "$(GIT_INDEX_FILE=/tmp/layout-index git write-tree)" = '15b6a7c804b5585b1e1087c21e374e4d28de3886'
          npm run check && npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep format selectors readable at desktop and mobile widths' -m 'Inspected browser screenshots exposed flex-shrunk selectors. Use labelled grid fields and add actual-width browser regressions. Exact clean tree 15b6a7c804b5585b1e1087c21e374e4d28de3886; 152 Node tests pass. No game behavior or recording changes.'
          git push origin HEAD:refs/heads/feature/reliability-play-library
