name: Demo source snapshot
on:
  push:
    branches: [feature/full-round-demo]
    paths: [.github/workflows/demo-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 616f9cf03caf17e0815925275d9fc04a71187526
      - run: git archive --format=tar HEAD > /tmp/demo-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: demo-source
          path: /tmp/demo-source.tar
          retention-days: 1
