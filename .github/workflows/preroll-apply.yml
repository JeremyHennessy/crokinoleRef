name: Apply locally verified pre-roll change
on:
  push:
    branches: [feature/buffered-shot-clips]
    paths: [.github/workflows/preroll-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact tested changes only to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/buffered-shot-clips
          test "$(git rev-parse HEAD^)" = c801b28b2be3929c98384fcc73921def92a519b5
          python .github/preroll-apply.py
          git rm .github/preroll-apply.py .github/preroll-browser-block.txt .github/workflows/preroll-apply.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = f9dec300bc53fb3a25f3d124651dbcc4418d130d
          npm run check
          npm test
          python -m py_compile tests/browser_smoke.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add bounded complete-session pre-shot buffering and pixel-level video proof tests' -m 'Exact local tested tree f9dec300bc53fb3a25f3d124651dbcc4418d130d reproduced; 99 Node tests pass. Full browser validation remains a PR gate. Temporary source-transport/apply helpers removed. Scoring and calibration unchanged.'
          git push origin HEAD:refs/heads/feature/buffered-shot-clips
